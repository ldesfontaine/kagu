# mcp-maison, le serveur MCP qui lit Kagu par son API avec un jeton
# d'API en lecture. À poser en /srv/workspace/mcp-maison/compose.yml, à côté
# de son .env et de data/mcp/ (installation.md, « Brancher un agent IA »).
# La version est épinglée par son tag et son empreinte (voir image) : changer
# de version, c'est changer la ligne image, rien d'autre.
name: mcp-maison
services:
  mcp:
    # Le tag et l'empreinte ensemble : un tag seul peut être déplacé. Pour une
    # autre version, l'empreinte se lit par
    # docker buildx imagetools inspect ghcr.io/ldesfontaine/mcp-maison:<tag> --format '{{json .Manifest.Digest}}'
    image: ghcr.io/ldesfontaine/mcp-maison:v0.1.0@sha256:31ceed07c7ada4c7c02cfec5cf95e73b7d6111e83f440ef0ee615b69f25c3660
    container_name: mcp-maison
    restart: unless-stopped
    # Réseau bridge, jamais `network_mode: host` : un conteneur exposé à
    # Internet ne partage pas la pile réseau de l'hôte. Le port n'est publié
    # que sur MCP_HOST (le Traefik de la machine le joint là) ; Kagu se
    # joint par host-gateway, l'IP du pont docker0, qui est celle de `listen`
    # (OPENCLOUD_URL en IP : Kagu refuse le nom host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MCP_HOST:?MCP_HOST manque dans .env (Paramètres, Jetons d'API)}:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      # Dans le conteneur : seul `ports` décide qui le joint.
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/mcp-maison.db
      AUDIT_LOG_PATH: /app/data/audit.jsonl
      PERMISSIONS_FILE: /app/data/permissions.yaml
      TOOL_GROUPS: core,opencloud
    # Un seul dossier, écrit par l'uid 1000 du conteneur : la base OAuth, le
    # journal, les droits.
    volumes:
      - ./data/mcp:/app/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
