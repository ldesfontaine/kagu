# Publie une version : binaires Linux amd64 et arm64, leurs sommes, la
# signature minisign des sommes (clé privée en secret de l'environnement
# « release », clés publiques courante et de secours embarquées dans le
# binaire) et l'attestation de provenance de GitHub.
# Quatre jobs. « build » compile et teste (npm, binaires) sans aucun secret et
# sans droit d'écriture ; il publie aussi le paquet du front (web/dist en
# archive, empreinte notée). « rebuild », sans Node, sans npm, sans cache,
# recompile depuis le tag avec ce paquet et refuse au moindre octet d'écart.
# « sign » tient la clé, sous l'environnement protégé « release » : il ne
# récupère pas le dépôt, n'installe rien, et ne fait que signer SHA256SUMS.
# « publish » vérifie, atteste et publie, sans la clé.
# Déclenché seulement par un tag vX.Y.Z poussé sur un commit de main. Une
# version publiée ne se réécrit jamais : un job échoue si elle existe.
# Actions épinglées par SHA, comme ci.yml.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # aucun secret ici, aucun droit d'écriture : npm tourne dans ce job
    outputs:
      front_sha256: ${{ steps.front.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: le tag est sur main, la version n'existe pas
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "la version $TAG existe déjà : une version ne se réécrit pas"
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: tests
        run: make front-check test

      - name: compiler amd64 et arm64
        env:
          TAG: ${{ github.ref_name }}
        run: make release VERSION="$TAG"

      - name: le build est reproductible
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp dist-release/SHA256SUMS /tmp/premier-build
          # sans le cache de compilation, le second build refait tout
          go clean -cache
          make release VERSION="$TAG"
          diff /tmp/premier-build dist-release/SHA256SUMS

      # Le web/dist du second build, celui que les binaires embarquent.
      # Archive stable (ordre, dates, propriétaires) : son empreinte se note
      # dans le résumé du job et passe à rebuild.
      - name: le paquet du front
        id: front
        run: |
          mkdir -p "$RUNNER_TEMP/front"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C web -cf "$RUNNER_TEMP/front/front.tar" dist
          empreinte=$(sha256sum "$RUNNER_TEMP/front/front.tar" | cut -d' ' -f1)
          echo "sha256=$empreinte" >> "$GITHUB_OUTPUT"
          echo "Paquet du front (web/dist) : sha256 $empreinte" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-release
          path: dist-release/
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front
          path: ${{ runner.temp }}/front/front.tar
          retention-days: 1
          if-no-files-found: error

  # Recompile depuis le tag, sans Node ni npm ni cache, avec le paquet du
  # front de build : un script npm piégé qui aurait touché une source Go ou la
  # chaîne de compilation dans build donne ici d'autres octets, et rien n'est
  # signé. Le paquet du front est une donnée embarquée, jamais exécutée ici.
  rebuild:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sums_sha256: ${{ steps.compare.outputs.sums_sha256 }}
    steps:
      # Tout l'historique, comme build : le commit embarqué
      # (git rev-parse --short) a la même longueur des deux côtés.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Sans cache : celui de build sort d'un runner où npm a tourné, et go
      # fait confiance à GOCACHE et à GOMODCACHE sans les revérifier. Modules
      # téléchargés à neuf, contrôlés par go.sum.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front
          path: ${{ runner.temp }}/front

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: ${{ runner.temp }}/dist-build

      - name: poser le paquet du front de build
        env:
          FRONT_SHA256: ${{ needs.build.outputs.front_sha256 }}
        run: |
          archive="$RUNNER_TEMP/front/front.tar"
          echo "$FRONT_SHA256  $archive" | sha256sum --strict -c
          # Sous dist/ seulement, fichiers et dossiers seulement : ni lien ni
          # chemin qui sorte de web/.
          if tar -tf "$archive" | grep -Ev '^dist/' || tar -tf "$archive" | grep -E '(^|/)\.\.(/|$)'; then
            echo "le paquet du front contient un chemin hors de dist/"
            exit 1
          fi
          if tar -tvf "$archive" | cut -c1 | grep -v '^[-d]$'; then
            echo "le paquet du front contient autre chose que des fichiers et des dossiers"
            exit 1
          fi
          find web/dist -mindepth 1 -delete
          tar -C web -xf "$archive" --no-same-owner --no-same-permissions

      - name: recompiler amd64 et arm64, sans npm
        env:
          TAG: ${{ github.ref_name }}
        run: make release-binaries VERSION="$TAG" RELEASE_DIR="$RUNNER_TEMP/dist-rebuild"

      - name: les binaires sont ceux de build, octet par octet
        id: compare
        run: |
          for fichier in opencloud-linux-amd64 opencloud-linux-arm64 SHA256SUMS; do
            cmp "$RUNNER_TEMP/dist-build/$fichier" "$RUNNER_TEMP/dist-rebuild/$fichier"
          done
          sommes=$(sha256sum "$RUNNER_TEMP/dist-rebuild/SHA256SUMS" | cut -d' ' -f1)
          echo "sums_sha256=$sommes" >> "$GITHUB_OUTPUT"

  sign:
    needs: rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # La clé de signature est un secret de cet environnement : relecteur
    # obligatoire, tags v* seulement (réglages du dépôt, docs/projet/12-methode.md).
    environment: release
    # Aucun droit : download-artifact lit les artefacts du même run par le
    # jeton du runner, pas par GITHUB_TOKEN.
    permissions: {}
    steps:
      # Pas de checkout, rien d'installé : le signataire est le binaire amd64
      # publié, que rebuild a recompilé sans npm à l'octet près.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: dist-release

      - name: les fichiers sont ceux que rebuild a recompilés
        working-directory: dist-release
        env:
          SUMS_SHA256: ${{ needs.rebuild.outputs.sums_sha256 }}
        run: |
          echo "$SUMS_SHA256  SHA256SUMS" | sha256sum --strict -c
          sha256sum --strict -c SHA256SUMS
          # LC_ALL=C : l'ordre du tri ne dépend pas de la langue du runner
          liste=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')
          if [ "$liste" != "SHA256SUMS opencloud-linux-amd64 opencloud-linux-arm64 " ]; then
            echo "le dossier reçu ne contient pas exactement les fichiers du build : $liste"
            exit 1
          fi
          # SHA256SUMS est ce qui est signé : il ne liste que les deux binaires
          noms=$(sed 's/^[0-9a-f]\{64\}  //' SHA256SUMS | LC_ALL=C sort | tr '\n' ' ')
          if [ "$noms" != "opencloud-linux-amd64 opencloud-linux-arm64 " ]; then
            echo "SHA256SUMS ne liste pas exactement les deux binaires : $noms"
            exit 1
          fi

      - name: signer les sommes
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # l'artefact perd le bit d'exécution
          signataire="$RUNNER_TEMP/signer"
          cp dist-release/opencloud-linux-amd64 "$signataire"
          chmod 0755 "$signataire"
          "$signataire" release sign -key-env RELEASE_SIGNING_KEY -version "$TAG" dist-release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist-release/SHA256SUMS.minisig
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [rebuild, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # créer la release et y déposer les fichiers
      id-token: write # l'attestation signe avec l'identité du job
      attestations: write # et se range dans le dépôt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: dist-release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist-release

      - name: les fichiers sont ceux que rebuild a recompilés
        working-directory: dist-release
        env:
          SUMS_SHA256: ${{ needs.rebuild.outputs.sums_sha256 }}
        run: |
          echo "$SUMS_SHA256  SHA256SUMS" | sha256sum --strict -c
          sha256sum --strict -c SHA256SUMS

      - name: vérifier avec les clés embarquées
        run: |
          verificateur="$RUNNER_TEMP/verifier"
          cp dist-release/opencloud-linux-amd64 "$verificateur"
          chmod 0755 "$verificateur"
          "$verificateur" release verify dist-release/opencloud-linux-amd64
          "$verificateur" release verify dist-release/opencloud-linux-arm64

      - name: la version n'existe toujours pas
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "la version $TAG existe déjà : une version ne se réécrit pas"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist-release/SHA256SUMS

      - name: publier la version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Binaires statiques Linux, signés. Vérifier : opencloud release verify <binaire>, ou minisign -Vm SHA256SUMS -P <clé de docs/installation.md>, puis sha256sum -c --ignore-missing SHA256SUMS. Installation : docs/installation.md."
          # La liste exacte, pas dist-release/* : rien d'autre ne se publie.
          fichiers=(dist-release/SHA256SUMS dist-release/SHA256SUMS.minisig dist-release/opencloud-linux-amd64 dist-release/opencloud-linux-arm64)
          if [ "${TAG#v0.}" != "$TAG" ]; then
            gh release create "$TAG" "${fichiers[@]}" --verify-tag --title "$TAG" --prerelease --notes "$notes"
          else
            gh release create "$TAG" "${fichiers[@]}" --verify-tag --title "$TAG" --notes "$notes"
          fi
